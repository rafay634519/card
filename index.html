<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>California Identification Card Generator</title>

    <!-- Google Font for Cursive Signature -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Caveat:wght@600&family=Roboto+Condensed:wght@700&family=Oswald:wght@500;600;700&display=swap"
        rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            padding: 30px 16px;
            background: #2b303a;
            font-family: Arial, Helvetica, sans-serif;
        }

        .app-layout {
            width: min(1300px, 100%);
            margin: auto;
            display: grid;
            grid-template-columns: 360px 1fr;
            gap: 30px;
            align-items: start;
        }

        .card-form {
            padding: 24px;
            border-radius: 14px;
            background: #ffffff;
            box-shadow: 0 10px 30px rgba(0, 0, 0, .3);
        }

        .card-form h1 {
            margin: 0 0 6px;
            color: #172d58;
            font-size: 22px;
        }

        .card-form p {
            margin: 0 0 16px;
            color: #666;
            font-size: 13px;
        }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
        }

        .card-form label {
            display: block;
            margin-top: 10px;
            color: #334a50;
            font-size: 11px;
            font-weight: bold;
            text-transform: uppercase;
        }

        .card-form input,
        .card-form select {
            width: 100%;
            margin-top: 4px;
            padding: 7px 9px;
            border: 1px solid #ccd3cf;
            border-radius: 6px;
            outline: none;
            font: inherit;
            font-size: 13px;
        }

        .card-form input:focus,
        .card-form select:focus {
            border-color: #0b4570;
            box-shadow: 0 0 0 3px rgba(11, 69, 112, 0.15);
        }

        .button-row {
            display: flex;
            gap: 10px;
            margin-top: 18px;
        }

        .button-row button {
            flex: 1;
            padding: 10px;
            border: 0;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
        }

        .reset-button {
            background: #e2e7e9;
            color: #334a50;
        }

        .clear-photo-button {
            background: #0b4570;
            color: #fff;
        }

        .download-button {
            background: linear-gradient(135deg, #0b4570, #1a6fa0);
            color: #fff;
            transition: transform 0.15s ease, box-shadow 0.15s ease;
        }

        .download-button:hover {
            transform: translateY(-1px);
            box-shadow: 0 4px 14px rgba(11, 69, 112, 0.4);
        }

        .download-button:active {
            transform: translateY(0);
        }

        /* ID Card Layout */
        .card-container {
            display: flex;
            justify-content: center;
            align-items: center;
            position: sticky;
            top: 20px;
        }

        .id-card {
            position: relative;
            width: 856px;
            height: 540px;
            border-radius: 26px;
            background-color: #fff;
            /* Replace the background image with your clean card template file */
            background-image: url('Gemini_Generated_Image_jl2lbhjl2lbhjl2l.jpg');
            background-size: 100% 100%;
            background-repeat: no-repeat;
            box-shadow: 0 18px 45px rgba(0, 0, 0, .45);
            overflow: hidden;
            font-family: 'Arial', sans-serif;
            user-select: none;
        }

        /* Main Portrait Photo */
        .photo-box {
            position: absolute;
            top: 92px;
            left: 41px;
            width: 254px;
            height: 332px;
            overflow: hidden;
            background: transparent;
            z-index: 2;
        }

        .photo-box img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* Signature */
        .signature {
            position: absolute;
            bottom: 46px;
            left: 55px;
            font-family: 'Caveat', cursive;
            font-size: 42px;
            font-weight: 600;
            color: #1a1a1a;
            z-index: 10;
            transform: rotate(-3deg);
            white-space: nowrap;
        }

        /* Phone Numbers Section */
        .phone-section {
            position: absolute;
            top: 114px;
            left: 308px;
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        .phone-row {
            display: flex;
            align-items: baseline;
            gap: 8px;
        }

        .phone-label {
            font-family: 'Arial Black', Gadget, sans-serif;
            font-size: 19px;
            color: #0b4570;
            letter-spacing: 0.5px;
        }

        .phone-val {
            font-family: 'Impact', 'Arial Black', sans-serif;
            font-size: 26px;
            color: #8b181a;
            letter-spacing: 1px;
        }

        /* Expiration Date */
        .exp-row {
            position: absolute;
            top: 188px;
            left: 308px;
            font-family: 'Arial Black', sans-serif;
            font-size: 21px;
            letter-spacing: 0.5px;
        }

        .exp-label {
            color: #0b4570;
            margin-right: 6px;
        }

        .exp-val {
            color: #8b181a;
        }

        /* Name and Address Details */
        .person-info {
            position: absolute;
            top: 228px;
            left: 308px;
            width: 400px;
        }

        .full-name {
            font-family: 'Arial Black', 'Impact', sans-serif;
            font-size: 28px;
            color: #111;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            line-height: 1.1;
            margin-bottom: 3px;
        }

        .address-text {
            font-family: 'Arial Black', sans-serif;
            font-size: 21px;
            color: #1a1a1a;
            line-height: 1.18;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        /* Date of Birth */
        .dob-container {
            position: absolute;
            top: 326px;
            left: 308px;
            font-family: 'Arial Black', sans-serif;
            font-size: 23px;
            letter-spacing: 0.5px;
        }

        .dob-label {
            color: #0b4570;
            margin-right: 6px;
        }

        .dob-val {
            color: #8b181a;
        }

        /* Ghost / Mini Portrait Photo */
        .mini-photo-box {
            position: absolute;
            top: 300px;
            left: 540px;
            width: 104px;
            height: 136px;
            overflow: hidden;
            opacity: 0.55;
            mix-blend-mode: multiply;
            z-index: 3;
        }

        .mini-photo-box img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* Bottom Details Row */
        .bottom-details {
            position: absolute;
            bottom: 45px;
            left: 345px;
            display: flex;
            gap: 14px;
            font-family: 'Arial Black', Gadget, sans-serif;
            font-size: 19px;
            color: #0b4570;
            z-index: 5;
        }

        .bottom-item span {
            color: #111;
        }

        .bottom-row-2 {
            position: absolute;
            bottom: 18px;
            left: 345px;
            display: flex;
            gap: 20px;
            font-family: 'Arial Black', Gadget, sans-serif;
            font-size: 19px;
            color: #0b4570;
            z-index: 5;
        }

        /* Class / Endorsement Info (Right Side) */
        .right-info {
            position: absolute;
            top: 168px;
            right: 80px;
            text-align: center;
            font-family: 'Arial Black', sans-serif;
            font-size: 20px;
            color: #0b4570;
            line-height: 1.15;
        }

        .right-info span {
            color: #111;
            display: block;
        }

        /* Issue Date at bottom right */
        .issue-block {
            position: absolute;
            bottom: 20px;
            right: 48px;
            font-family: 'Arial Black', sans-serif;
            text-align: right;
            font-size: 16px;
            line-height: 1.15;
            color: #0b4570;
        }

        .issue-block span {
            color: #111;
        }

        @media (max-width: 1220px) {
            .app-layout {
                grid-template-columns: 1fr;
                justify-items: center;
            }

            .card-form {
                width: min(856px, 100%);
            }
        }
    </style>
</head>

<body>
    <div class="app-layout">

        <!-- Form Control -->
        <form id="cardForm" class="card-form">
            <h1>Card Details</h1>
            <p>Customize card fields to live-update the template</p>

            <label for="photoInput">Portrait Image</label>
            <input id="photoInput" type="file" accept="image/*" />

            <div class="form-grid">
                <div>
                    <label for="ph1Input">Phone 1 (PH 1)</label>
                    <input id="ph1Input" type="text" value="415-555-5556" maxlength="15" />
                </div>
                <div>
                    <label for="ph2Input">Phone 2 (PH 2)</label>
                    <input id="ph2Input" type="text" value="415-555-5556" maxlength="15" />
                </div>
            </div>

            <div class="form-grid">
                <div>
                    <label for="expInput">Expiration Date</label>
                    <input id="expInput" type="text" value="03/07/2027" maxlength="10" />
                </div>
                <div>
                    <label for="dobInput">Date of Birth</label>
                    <input id="dobInput" type="text" value="03/07/2019" maxlength="10" />
                </div>
            </div>

            <label for="nameInput">Full Name</label>
            <input id="nameInput" type="text" value="LIAM TAYLOR" maxlength="28" />

            <label for="addressInput">Street Address</label>
            <input id="addressInput" type="text" value="1234 YOUR ST" maxlength="32" />

            <label for="cityInput">City, State, Zip</label>
            <input id="cityInput" type="text" value="SAN FRANCISCO, CA 94016" maxlength="32" />

            <div class="form-grid">
                <div>
                    <label for="classInput">Class Type</label>
                    <input id="classInput" type="text" value="CHILD" maxlength="10" />
                </div>
                <div>
                    <label for="sexInput">Sex</label>
                    <input id="sexInput" type="text" value="M" maxlength="2" />
                </div>
            </div>

            <div class="form-grid">
                <div>
                    <label for="hairInput">Hair</label>
                    <input id="hairInput" type="text" value="BLN" maxlength="4" />
                </div>
                <div>
                    <label for="eyesInput">Eyes</label>
                    <input id="eyesInput" type="text" value="BLU" maxlength="4" />
                </div>
            </div>

            <div class="form-grid">
                <div>
                    <label for="heightInput">Height</label>
                    <input id="heightInput" type="text" value="3'-01&quot;" maxlength="8" />
                </div>
                <div>
                    <label for="weightInput">Weight</label>
                    <input id="weightInput" type="text" value="34 lb" maxlength="10" />
                </div>
            </div>

            <label for="issInput">Issue Date (ISS)</label>
            <input id="issInput" type="text" value="12/25/2022" maxlength="10" />

            <div class="button-row">
                <button class="reset-button" type="reset">Reset</button>
                <button class="clear-photo-button" id="clearPhotoButton" type="button">Reset Photo</button>
                <button class="download-button" id="downloadButton" type="button">⬇ Download</button>
            </div>
        </form>

        <!-- Template Display -->
        <div class="card-container">
            <main class="id-card" aria-label="California ID Card Sample">

                <!-- Main Photo -->
                <div class="photo-box">
                    <img id="mainPhoto" src="https://placehold.co/254x332/dcdcdc/666?text=PORTRAIT" alt="Portrait" />
                </div>

                <!-- Cursive Signature -->
                <div id="signatureText" class="signature">Liam Taylor</div>

                <!-- Phone Numbers -->
                <div class="phone-section">
                    <div class="phone-row">
                        <span class="phone-label">PH 1</span>
                        <span id="ph1Val" class="phone-val">415-555-5556</span>
                    </div>
                    <div class="phone-row">
                        <span class="phone-label">PH 2</span>
                        <span id="ph2Val" class="phone-val">415-555-5556</span>
                    </div>
                </div>

                <!-- Expiration -->
                <div class="exp-row">
                    <span class="exp-label">EXP</span>
                    <span id="expVal" class="exp-val">03/07/2027</span>
                </div>

                <!-- Personal Info -->
                <div class="person-info">
                    <div id="nameVal" class="full-name">LIAM TAYLOR</div>
                    <div class="address-text">
                        <div id="addressVal">1234 YOUR ST</div>
                        <div id="cityVal">SAN FRANCISCO, CA 94016</div>
                    </div>
                </div>

                <!-- DOB -->
                <div class="dob-container">
                    <span class="dob-label">DOB</span>
                    <span id="dobVal" class="dob-val">03/07/2019</span>
                </div>

                <!-- Ghost Mini Photo -->
                <div class="mini-photo-box">
                    <img id="miniPhoto" src="https://placehold.co/104x136/dcdcdc/666?text=GHOST"
                        alt="Mini Ghost Portrait" />
                </div>

                <!-- Class -->
                <div class="right-info">
                    CLASS
                    <span id="classVal">CHILD</span>
                </div>

                <!-- Bottom Specs -->
                <div class="bottom-details">
                    <div class="bottom-item">SEX <span id="sexVal">M</span></div>
                    <div class="bottom-item">HAIR <span id="hairVal">BLN</span></div>
                    <div class="bottom-item">EYES <span id="eyesVal">BLU</span></div>
                </div>

                <div class="bottom-row-2">
                    <div class="bottom-item">HGT <span id="heightVal">3'-01"</span></div>
                    <div class="bottom-item">WGT <span id="weightVal">34 lb</span></div>
                </div>

                <!-- Issue Date -->
                <div class="issue-block">
                    ISS<br />
                    <span id="issVal">12/25/2022</span>
                </div>

            </main>
        </div>

    </div>

    <script>
        // Generate placeholder image locally as a data URL (avoids CORS issues)
        function createPlaceholder(w, h, text) {
            const c = document.createElement("canvas");
            c.width = w; c.height = h;
            const ctx = c.getContext("2d");
            ctx.fillStyle = "#dcdcdc";
            ctx.fillRect(0, 0, w, h);
            ctx.fillStyle = "#666";
            ctx.font = "bold 18px Arial";
            ctx.textAlign = "center";
            ctx.textBaseline = "middle";
            ctx.fillText(text, w / 2, h / 2);
            return c.toDataURL("image/png");
        }

        const defaultPhoto = createPlaceholder(254, 332, "PORTRAIT");

        // Set initial placeholders
        document.getElementById("mainPhoto").src = defaultPhoto;
        document.getElementById("miniPhoto").src = createPlaceholder(104, 136, "GHOST");

        function bindText(inputId, cardId, uppercase = false) {
            const input = document.getElementById(inputId);
            const target = document.getElementById(cardId);

            function update() {
                let val = input.value.trim();
                target.textContent = uppercase ? val.toUpperCase() : val;
            }

            input.addEventListener("input", update);
            input.addEventListener("change", update);
        }

        // Live Binding
        bindText("ph1Input", "ph1Val");
        bindText("ph2Input", "ph2Val");
        bindText("expInput", "expVal");
        bindText("nameInput", "nameVal", true);
        bindText("addressInput", "addressVal", true);
        bindText("cityInput", "cityVal", true);
        bindText("dobInput", "dobVal");
        bindText("classInput", "classVal", true);
        bindText("sexInput", "sexVal", true);
        bindText("hairInput", "hairVal", true);
        bindText("eyesInput", "eyesVal", true);
        bindText("heightInput", "heightVal");
        bindText("weightInput", "weightVal");
        bindText("issInput", "issVal");

        // Sync Signature with Name
        document.getElementById("nameInput").addEventListener("input", (e) => {
            const words = e.target.value.toLowerCase().split(' ');
            const capitalized = words.map(w => w.charAt(0).toUpperCase() + w.slice(1)).join(' ');
            document.getElementById("signatureText").textContent = capitalized || "Signature";
        });

        // Photo Upload — convert to base64 data URL so html2canvas can read it
        document.getElementById("photoInput").addEventListener("change", (event) => {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = (e) => {
                document.getElementById("mainPhoto").src = e.target.result;
                document.getElementById("miniPhoto").src = e.target.result;
            };
            reader.readAsDataURL(file);
        });

        // Reset Photo
        document.getElementById("clearPhotoButton").addEventListener("click", () => {
            document.getElementById("photoInput").value = "";
            document.getElementById("mainPhoto").src = defaultPhoto;
            document.getElementById("miniPhoto").src = createPlaceholder(104, 136, "GHOST");
        });

        // Full Form Reset
        document.getElementById("cardForm").addEventListener("reset", () => {
            setTimeout(() => {
                document.getElementById("mainPhoto").src = defaultPhoto;
                document.getElementById("miniPhoto").src = createPlaceholder(104, 136, "GHOST");
                document.querySelectorAll("#cardForm input").forEach((field) => {
                    field.dispatchEvent(new Event("input"));
                });
            }, 0);
        });

        // Download ID Card as PNG
        document.getElementById("downloadButton").addEventListener("click", () => {
            const card = document.querySelector(".id-card");
            const btn = document.getElementById("downloadButton");
            btn.textContent = "Rendering…";
            btn.disabled = true;

            html2canvas(card, {
                scale: 2,
                useCORS: false,
                allowTaint: false,
                backgroundColor: "#ffffff"
            }).then(canvas => {
                const link = document.createElement("a");
                link.download = "id-card.png";
                link.href = canvas.toDataURL("image/png");
                link.click();
            }).catch(err => {
                console.error("Download failed:", err);
                alert("Download failed. See console for details.");
            }).finally(() => {
                btn.textContent = "⬇ Download";
                btn.disabled = false;
            });
        });
    </script>
</body>

</html>
